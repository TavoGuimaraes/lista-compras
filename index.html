<!DOCTYPE html>
<html lang="pt-BR">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Compras</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#27ae60">
  <style>
    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background:#f0f4f8;
      color:#1a1a2e;
      min-height:100vh;
      padding:16px;
    }

    /* HEADER FIXO */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background:#27ae60;
      color:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:10px 16px;
      margin:-16px -16px 12px -16px;
      box-shadow:0 2px 8px rgba(0,0,0,0.15);
    }
    header h1 { font-size:1.2rem; color:white; }
    header small { font-size:0.75rem; color:rgba(255,255,255,0.85); display:block; }

    /* CARD RESUMO TOPO - FIXO */
    #card-resumo-topo {
      position: sticky;
      top: 52px;
      z-index: 99;
      background:white;
      border-radius:10px;
      padding:10px 12px;
      margin-bottom:10px;
      box-shadow:0 2px 8px rgba(0,0,0,0.12);
      border-left:4px solid #27ae60;
    }
    .resumo-topo-linha {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }
    .resumo-topo-total {
      font-size:1.3rem;
      font-weight:800;
      color:#27ae60;
    }
    .resumo-topo-label {
      font-size:0.7rem;
      color:#888;
      margin-bottom:2px;
    }
    #orcamento-info-topo {
      font-size:0.8rem;
      margin-top:3px;
      font-weight:600;
    }
    .orcamento-input-wrap {
      display:flex;
      flex-direction:column;
      min-width:130px;
    }
    .orcamento-input-wrap label {
      font-size:0.7rem;
      color:#888;
      margin-bottom:3px;
    }
    .orcamento-input-wrap input {
      padding:5px 8px;
      border-radius:8px;
      border:1px solid #d0d7de;
      font-size:0.9rem;
      background:#fafafa;
      margin-bottom:0;
    }

    .btn {
      border:none;
      border-radius:8px;
      padding:8px 12px;
      font-size:0.85rem;
      font-weight:600;
      cursor:pointer;
    }
    .btn-primario  { background:#27ae60; color:white; }
    .btn-secundario{ background:#e1ecff; color:#2c3e50; }
    .btn-header    { background:rgba(255,255,255,0.2); color:white; border:none;
                     border-radius:8px; padding:6px 10px; font-size:0.8rem;
                     font-weight:600; cursor:pointer; }

    .card {
      background:white;
      border-radius:10px;
      padding:12px;
      margin-bottom:10px;
      box-shadow:0 1px 4px rgba(0,0,0,0.08);
    }
    .card h2 { font-size:1rem; margin-bottom:10px; color:#27ae60; }

    label {
      font-size:0.75rem;
      font-weight:600;
      color:#555;
      display:block;
      margin-bottom:3px;
    }
    input, select {
      width:100%;
      padding:7px 9px;
      margin-bottom:8px;
      border-radius:8px;
      border:1px solid #d0d7de;
      font-size:0.9rem;
      background:#fafafa;
    }
    input:focus, select:focus {
      outline:none;
      border-color:#27ae60;
      background:white;
    }
    .form-row { display:flex; gap:8px; flex-wrap:wrap; }
    .fg-nome { flex:2; min-width:140px; }
    .fg-peq  { flex:1; min-width:70px; }

    .lista-vazia {
      text-align:center;
      padding:20px 10px;
      color:#888;
      font-size:0.9rem;
    }
    .item-linha {
      display:flex;
      align-items:flex-start;
      gap:8px;
      padding:8px 0;
      border-bottom:1px solid #f0f0f0;
    }
    .item-linha:last-child { border-bottom:none; }
    .item-check {
      width:24px;
      height:24px;
      border-radius:50%;
      border:2px solid #27ae60;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:0.8rem;
      cursor:pointer;
      flex-shrink:0;
      color:white;
      margin-top:2px;
    }
    .item-check.marcado { background:#27ae60; }
    .item-conteudo { flex:1; min-width:0; }
    .item-nome {
      font-weight:600;
      font-size:0.9rem;
      margin-bottom:2px;
      word-break:break-word;
    }
    .item-nome.comprado { text-decoration:line-through; color:#aaa; }
    .item-detalhe { font-size:0.8rem; color:#666; margin-bottom:2px; }
    .item-cat {
      font-size:0.7rem;
      color:#27ae60;
      background:#e8f8f0;
      border-radius:10px;
      padding:1px 6px;
      display:inline-block;
    }
    .item-acoes {
      display:flex;
      flex-direction:column;
      gap:4px;
      align-items:flex-end;
    }
    .btn-mini {
      padding:4px 8px;
      font-size:0.72rem;
      border-radius:6px;
      border:none;
      cursor:pointer;
      font-weight:600;
    }
    .btn-del    { background:#ffe5e5; color:#c0392b; }
    .btn-editar { background:#eaf4ff; color:#2980b9; }

    .rodape { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }

    textarea {
      width:100%;
      min-height:120px;
      padding:8px;
      border-radius:8px;
      border:1px solid #d0d7de;
      font-size:0.82rem;
      font-family:monospace;
      background:#fafafa;
      margin-top:6px;
    }
    .prog-wrap { margin-bottom:8px; }
    .prog-info {
      display:flex;
      justify-content:space-between;
      font-size:0.75rem;
      color:#888;
      margin-bottom:3px;
    }
    .prog-bar  { height:6px; background:#e0e0e0; border-radius:10px; overflow:hidden; }
    .prog-fill {
      height:100%;
      background:linear-gradient(90deg,#2ecc71,#27ae60);
      border-radius:10px;
      transition:width 0.4s;
    }

    .orc-alerta    { color:#f39c12; }
    .orc-estourado { color:#e74c3c; }

    #inp-preco:focus { border-color:#27ae60; background:#f0fff4; }
  </style>
</head>

<!-- HEADER FIXO -->
<header>
  <div>
    <h1>🛒 Lista de Compras</h1>
    <small id="subtitulo">0 itens • R$ 0,00</small>
  </div>
  <button class="btn-header" onclick="carregarBase()">📋 Lista base</button>
</header>

<!-- CARD RESUMO FIXO NO TOPO -->
<div id="card-resumo-topo">
  <div class="resumo-topo-linha">
    <div>
      <div class="resumo-topo-label">Total da compra</div>
      <div class="resumo-topo-total" id="resumo-total-topo">R$ 0,00</div>
      <div id="orcamento-info-topo"></div>
    </div>
    <div class="orcamento-input-wrap">
      <label for="inp-orcamento-topo">Orçamento (R$)</label>
      <input id="inp-orcamento-topo" type="number" min="0" step="0.01"
             placeholder="Ex: 300,00" oninput="atualizarOrcamento()" />
    </div>
  </div>
  <!-- barra de progresso no resumo topo -->
  <div class="prog-wrap" id="prog-wrap" style="display:none;margin-top:8px;">
    <div class="prog-info">
      <span id="prog-texto">0 de 0 comprados</span>
      <span id="prog-pct">0%</span>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
</div>

<!-- CARD NOVO ITEM -->
<div class="card">
  <h2>Novo item</h2>

  <div class="form-row">
    <div class="fg-nome">
      <label for="inp-nome">Nome</label>
      <input id="inp-nome" type="text" placeholder="Ex: Arroz ou selecione abaixo" />
    </div>
  </div>

  <div class="form-row">
    <div class="fg-nome">
      <label for="sel-base">Itens cadastrados (opcional)</label>
      <select id="sel-base" onchange="preencherPorBase()">
        <option value="">Selecione um item da base...</option>
      </select>
    </div>
  </div>

  <div class="form-row">
    <div class="fg-peq">
      <label for="inp-qtd">Qtd</label>
      <input id="inp-qtd" type="number" min="0.1" step="0.1" value="1" />
    </div>
    <div class="fg-peq">
      <label for="inp-preco">Preço (R$)</label>
      <input id="inp-preco" type="text" inputmode="numeric" placeholder="0,00" autocomplete="off" />
    </div>
    <div class="fg-nome">
      <label for="inp-cat">Categoria (opcional)</label>
      <select id="inp-cat">
        <option value="">(nenhuma)</option>
        <option value="Hortifruti">Hortifruti</option>
        <option value="Açougue">Açougue</option>
        <option value="Padaria">Padaria</option>
        <option value="Laticínios">Laticínios</option>
        <option value="Bebidas">Bebidas</option>
        <option value="Limpeza">Limpeza</option>
        <option value="Higiene">Higiene</option>
        <option value="Congelados">Congelados</option>
        <option value="Outros">Outros</option>
      </select>
    </div>
  </div>

  <button class="btn btn-primario" style="width:100%;margin-top:4px" onclick="adicionarItem()">+ Adicionar</button>
</div>

<!-- CARD LISTA -->
<div class="card">
  <h2>Itens da lista</h2>

  <div id="lista-itens"></div>
  <div class="lista-vazia" id="lista-vazia">
    Sua lista está vazia. Adicione itens acima ou clique em "Lista base".
  </div>

  <div class="rodape">
    <button class="btn btn-secundario" onclick="compartilhar()">📤 Compartilhar</button>
    <button class="btn btn-secundario" onclick="limparLista()">🗑️ Limpar lista</button>
  </div>
</div>

<!-- CARD COMPARTILHAR -->
<div class="card" id="card-compartilhar" style="display:none">

  <textarea id="txt-compartilhar" readonly></textarea>
  <button class="btn btn-primario" style="width:100%;margin-top:8px" onclick="copiarTexto()">📋 Copiar texto</button>
</div>

let orcamento = 0;
let digitosPreco = '';

// ===== MÁSCARA PREÇO =====
function aplicarMascaraPreco(e) {
  const tecla = e.key;
  if (tecla === 'Enter') { adicionarItem(); e.preventDefault(); return; }
  if (tecla === 'Backspace') {
    digitosPreco = digitosPreco.slice(0,-1);
    e.preventDefault();
    atualizarExibicaoPreco();
    return;
  }
  if (tecla >= '0' && tecla <= '9') {
    if (digitosPreco.length >= 7) { e.preventDefault(); return; }
    digitosPreco += tecla;
    e.preventDefault();
    atualizarExibicaoPreco();
    return;
  }
  if (tecla.length === 1) e.preventDefault();
}

function atualizarExibicaoPreco() {
  const inp = document.getElementById('inp-preco');
  if (!inp) return;
  if (digitosPreco === '') { inp.value=''; return; }
  const padded = digitosPreco.padStart(3,'0');
  const reais  = padded.slice(0,-2);
  const cent   = padded.slice(-2);
  inp.value = parseInt(reais,10).toLocaleString('pt-BR') + ',' + cent;
}

function getPrecoNumerico() {
  if (digitosPreco === '') return 0;
  return parseInt(digitosPreco,10) / 100;
}

function resetarPreco() {
  digitosPreco = '';
  const inp = document.getElementById('inp-preco');
  if (inp) inp.value = '';
}

// ===== UTIL =====
function fmt(v) {
  return 'R$ ' + Number(v).toLocaleString('pt-BR',{
    minimumFractionDigits:2, maximumFractionDigits:2
  });
}

// ===== SELECT BASE =====
function preencherSelectBase() {
  const sel = document.getElementById('sel-base');
  if (!sel) return;
  sel.innerHTML = '<option value="">Selecione um item da base...</option>';
  const ord = [...LISTA_BASE].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  ord.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item.nome;
    opt.textContent = item.nome;
    sel.appendChild(opt);
  });
}

function preencherPorBase() {
  const sel = document.getElementById('sel-base');
  const nomeSel = sel.value;
  if (!nomeSel) return;
  const base = LISTA_BASE.find(i => i.nome === nomeSel);
  if (!base) return;
  document.getElementById('inp-nome').value = base.nome;
  document.getElementById('inp-qtd').value  = base.qtd || 1;
  document.getElementById('inp-cat').value  =
    base.cat && base.cat !== 'Geral' ? base.cat : '';
  digitosPreco = base.preco && base.preco > 0
    ? String(Math.round(base.preco * 100)) : '';
  atualizarExibicaoPreco();
  document.getElementById('inp-preco').focus();
}

// ===== AÇÕES =====
function carregarBase() {
  if (itens.length > 0 && !confirm('Substituir a lista atual pela lista base?')) return;
  itens = LISTA_BASE.map(i => ({
    id: Date.now()+Math.random(),
    nome:i.nome, qtd:i.qtd, preco:i.preco,
    unid:i.unid||'un', cat:i.cat||'', comprado:false
  }));
  renderizar();
}

function adicionarItem() {
  const nome  = document.getElementById('inp-nome').value.trim();
  const qtd   = parseFloat(document.getElementById('inp-qtd').value) || 0;
  const preco = getPrecoNumerico();
  const cat   = document.getElementById('inp-cat').value || '';
  if (!nome) { alert('Digite o nome do item'); document.getElementById('inp-nome').focus(); return; }
  if (qtd <= 0) { alert('Quantidade inválida'); document.getElementById('inp-qtd').focus(); return; }
  itens.push({ id:Date.now(), nome, qtd, preco, unid:'un', cat, comprado:false });
  document.getElementById('inp-nome').value  = '';
  document.getElementById('inp-qtd').value   = '1';
  document.getElementById('inp-cat').value   = '';
  document.getElementById('sel-base').value  = '';
  resetarPreco();
  document.getElementById('inp-nome').focus();
  renderizar();
}

function limparLista() {
  if (!confirm('Limpar todos os itens da lista?')) return;
  itens = [];
  renderizar();
}

function toggleComprado(id) {
  const it = itens.find(i => i.id===id);
  if (!it) return;
  it.comprado = !it.comprado;
  renderizar();
}

function removerItem(id) {
  itens = itens.filter(i => i.id!==id);
  renderizar();
}

function editarItem(id) {
  const it = itens.find(i => i.id===id);
  if (!it) return;
  const nq = prompt('Quantidade para "'+it.nome+'":',it.qtd);
  if (nq===null) return;
  const np = prompt('Preço unitário (R$) para "'+it.nome+'":',it.preco);
  if (np===null) return;
  let v1 = parseFloat(nq); if (isNaN(v1)||v1<0) v1=0; it.qtd=v1;
  let v2 = parseFloat(np); if (isNaN(v2)||v2<0) v2=0; it.preco=v2;
  renderizar();
}

// ===== ORÇAMENTO / RESUMO =====
function atualizarOrcamento() {
  const inp = document.getElementById('inp-orcamento-topo');
  orcamento = parseFloat(inp.value) || 0;
  renderizarResumo();
}

function renderizarResumo() {
  const total = itens.reduce((s,i) => s + i.qtd*i.preco, 0);

  document.getElementById('subtitulo').textContent =
    `${itens.length} ite${itens.length===1?'m':'ns'} • ${fmt(total)}`;

  document.getElementById('resumo-total-topo').textContent = fmt(total);

  const info = document.getElementById('orcamento-info-topo');
  info.textContent = '';
  info.className = '';

  if (orcamento && orcamento > 0) {
    const diff = orcamento - total;
    if (diff >= orcamento * 0.1) {
      info.className = 'orc-ok';
      info.textContent = 'Sobra ' + fmt(diff);
    } else if (diff >= 0) {
      info.className = 'orc-alerta';
      info.textContent = 'Quase no limite: resta ' + fmt(diff);
    } else {
      info.className = 'orc-estourado';
      info.textContent = 'Estourou em ' + fmt(Math.abs(diff));
    }
  }

  atualizarProgresso();
}

function atualizarProgresso() {
  const wrap = document.getElementById('prog-wrap');
  if (itens.length === 0) { wrap.style.display='none'; return; }
  const comprados = itens.filter(i=>i.comprado).length;
  const pct = Math.round((comprados/itens.length)*100);
  wrap.style.display = '';
  document.getElementById('prog-texto').textContent =
    `${comprados} de ${itens.length} comprados`;
  document.getElementById('prog-pct').textContent = pct+'%';
  document.getElementById('prog-fill').style.width = pct+'%';
}

// ===== RENDER =====
function renderizar() {
  const cont  = document.getElementById('lista-itens');
  const vazio = document.getElementById('lista-vazia');
  cont.innerHTML = '';

  if (itens.length === 0) {
    vazio.style.display = '';
    renderizarResumo();
    return;
  }
  vazio.style.display = 'none';

  const ord = [...itens].sort((a,b) => a.comprado - b.comprado);
  ord.forEach(item => {
    const linha = document.createElement('div');
    linha.className = 'item-linha';

    const chk = document.createElement('div');
    chk.className = 'item-check' + (item.comprado ? ' marcado' : '');
    chk.textContent = item.comprado ? '✓' : '';
    chk.onclick = () => toggleComprado(item.id);

    const contItem = document.createElement('div');
    contItem.className = 'item-conteudo';

    const nome = document.createElement('div');
    nome.className = 'item-nome' + (item.comprado ? ' comprado' : '');
    nome.textContent = item.nome;

    const det = document.createElement('div');
    det.className = 'item-detalhe';
    const tot = item.qtd * item.preco;
    det.textContent = `${item.qtd} un × ${fmt(item.preco)} = ${fmt(tot)}`;

    contItem.appendChild(nome);
    contItem.appendChild(det);

    if (item.cat) {
      const cat = document.createElement('div');
      cat.innerHTML = `<span class="item-cat">${item.cat}</span>`;
      contItem.appendChild(cat);
    }

    const acoes = document.createElement('div');
    acoes.className = 'item-acoes';

    const bEd = document.createElement('button');
    bEd.className = 'btn-mini btn-editar';
    bEd.textContent = 'Editar';
    bEd.onclick = () => editarItem(item.id);

    const bDel = document.createElement('button');
    bDel.className = 'btn-mini btn-del';
    bDel.textContent = 'Remover';
    bDel.onclick = () => removerItem(item.id);

    acoes.appendChild(bEd);
    acoes.appendChild(bDel);

    linha.appendChild(chk);
    linha.appendChild(contItem);
    linha.appendChild(acoes);
    cont.appendChild(linha);
  });

  renderizarResumo();
}

// ===== COMPARTILHAR =====
function compartilhar() {
  if (itens.length === 0) { alert('A lista está vazia.'); return; }
  let txt = '🛒 Lista de Compras\n\n';
  itens.forEach(item => {
    const status = item.comprado ? '✅' : '⬜';
    const tot = item.qtd * item.preco;
    txt += `${status} ${item.nome} - ${item.qtd} un × ${fmt(item.preco)} = ${fmt(tot)}\n`;
  });
  const total = itens.reduce((s,i) => s+i.qtd*i.preco, 0);
  txt += `\nTotal: ${fmt(total)}`;
  document.getElementById('txt-compartilhar').value = txt;
  document.getElementById('card-compartilhar').style.display = '';
}

function copiarTexto() {
  const ta = document.getElementById('txt-compartilhar');
  ta.select();
  try { document.execCommand('copy'); alert('Texto copiado! Cole no WhatsApp.'); }
  catch { alert('Selecione o texto e copie manualmente.'); }
}

// ===== INIT =====
document.getElementById('inp-preco').addEventListener('keydown', aplicarMascaraPreco);
document.getElementById('inp-nome').addEventListener('keydown', e => {
  if (e.key === 'Enter') adicionarItem();
});
preencherSelectBase();
renderizar();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
